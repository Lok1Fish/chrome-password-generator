<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; font-family: Arial, sans-serif; padding: 12px; margin: 0; box-sizing: border-box; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 8px; text-align: center; font-weight: bold; font-size: 14px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; }
    
    /* Кнопка режима госсервисов */
    .gov-mode-container { margin-bottom: 10px; }
    .btn-gov { background: #0c4a60; font-size: 12px; padding: 6px; margin-bottom: 8px; transition: background 0.2s; }
    .btn-gov.active { background: #10b981; box-shadow: 0 0 5px rgba(16, 185, 129, 0.5); }

    /* Стили для чекбоксов */
    .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; font-size: 12px; }
    .checkbox-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .checkbox-group.disabled { opacity: 0.5; pointer-events: none; }

    button { width: 100%; padding: 8px; margin-bottom: 6px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; }
    button:hover { background: #0056b3; }
    .btn-copy { background: #28a745; }
    .btn-copy:hover { background: #218838; }
    
    /* Стили для истории */
    .history-title { font-weight: bold; margin-top: 15px; margin-bottom: 5px; font-size: 14px; border-top: 1px solid #ccc; padding-top: 10px; display: flex; justify-content: space-between; align-items: center;}
    .clear-history { font-size: 11px; background: none; color: #dc3545; border: none; padding: 0; margin: 0; width: auto; cursor: pointer; font-weight: normal; }
    .clear-history:hover { text-decoration: underline; background: none; }
    .history-container { max-height: 140px; overflow-y: auto; font-size: 11px; background: #f8f9fa; border: 1px solid #e2e8f0; padding: 4px; border-radius: 4px; }
    .history-item { padding: 6px; border-bottom: 1px solid #edf2f7; word-break: break-all; display: flex; justify-content: space-between; align-items: center; }
    .history-item:last-child { border-bottom: none; }
    .history-info { flex-grow: 1; margin-right: 8px; }
    .meta { color: #666; font-size: 10px; }
    .btn-mini-copy { width: auto; font-size: 10px; padding: 2px 6px; margin: 0; background: #6c757d; }
    .btn-mini-copy:hover { background: #5a6268; }
  </style>
</head>
<body>
  <input type="text" id="passwordResult" readonly placeholder="Здесь будет пароль">
  
  <div class="row">
    <label for="length">Длина: <span id="lenVal">12</span></label>
    <input type="range" id="length" min="6" max="30" value="12">
  </div>

  <!-- Кнопка режима Госсервисов -->
  <div class="gov-mode-container">
    <button id="btnGovMode" class="btn-gov">🇷🇺 Режим: Для госсервисов (ВЫКЛ)</button>
  </div>

  <!-- Настройки состава пароля -->
  <div class="checkbox-group" id="checkboxGroup">
    <label><input type="checkbox" id="chkLowercase" checked> abc (строчные)</label>
    <label><input type="checkbox" id="chkUppercase" checked> ABC (прописные)</label>
    <label><input type="checkbox" id="chkNumbers" checked> 123 (цифры)</label>
    <label><input type="checkbox" id="chkSymbols" checked> спецсимволы</label>
  </div>

  <button id="generate">Сгенерировать</button>
  <button id="copy" class="btn-copy">Копировать</button>

  <div class="history-title">
    История 
    <button id="clearHistory" class="clear-history">очистить</button>
  </div>
  <div id="historyContainer" class="history-container">Нет записей</div>

  <script src="popup.js"></script>
</body>
</html>
